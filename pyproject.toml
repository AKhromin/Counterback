[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-recorder"
version = "0.1.1"
description = "Raw-first Binance Spot market-depth recorder and offline verifier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KCL Backtesting Project" }]
dependencies = [
  "aiohttp>=3.10,<4",
  "PyYAML>=6.0,<7",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
depth-recorder = "depth_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not live' --strict-markers"
testpaths = ["tests"]
markers = ["live: requires a non-US network and live Binance endpoints"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["depth_recorder"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["depth_recorder"]
